<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tazlify – Modelos 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5ff;--ink:#14173d;--muted:#4d5173;--card:#fff;--line:#d9dcef;
  --c1:#2f4bff;--c2:#ff7eb6;--c3:#ffd23f;--c4:#3fd9a8;--c5:#9b6bff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1030;--ink:#f1f2fb;--muted:#a9aed3;--card:#181c4a;--line:#2c316b}}
:root[data-theme="dark"]{--bg:#0e1030;--ink:#f1f2fb;--muted:#a9aed3;--card:#181c4a;--line:#2c316b}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body)}
a{color:inherit}:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.5rem}
header.top{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0}
.logo{font:800 1.3rem var(--display);text-decoration:none;display:flex;align-items:center;gap:.6rem}
.logo b{width:1.4rem;height:1.4rem;background:var(--c3);border-radius:.3rem;box-shadow:.35rem .35rem 0 var(--c2)}
nav a{margin-left:1.4rem;text-decoration:none;font-weight:500}nav a:hover{text-decoration:underline;text-underline-offset:4px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center;padding:2.5rem 0 4.5rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero small{font-weight:600;color:var(--c1)}
.hero h1{font:800 clamp(2.8rem,9vw,6.5rem)/.95 var(--display);letter-spacing:-.04em;margin:.5rem 0 1.25rem}
.hero p{color:var(--muted);font-size:1.15rem;max-width:32rem;margin:0 0 1.75rem}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:.8rem 1.5rem;border-radius:.6rem;font-weight:600;text-decoration:none;border:2px solid var(--ink)}
.btn.alt{background:transparent;color:var(--ink)}.btn:hover{background:var(--c1);border-color:var(--c1);color:#fff}
#mosaic{display:grid;grid-template-columns:repeat(8,1fr);gap:.4rem;aspect-ratio:1;max-width:28rem;justify-self:center;width:100%}
#mosaic i{border-radius:.35rem;transition:background .25s,transform .25s}#mosaic i:hover{transform:scale(1.15)}
section{padding:3.5rem 0}
h2{font:800 clamp(2rem,5vw,3.2rem)/1 var(--display);letter-spacing:-.03em;margin:0 0 .5rem}
.sub{color:var(--muted);margin:0 0 2rem;max-width:36rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:1.25rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:1rem;overflow:hidden;text-decoration:none;display:block;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--ink)}
.thumb{aspect-ratio:4/3;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:2px;background:var(--ink);padding:2px;width:100%}
.thumb i{display:block}
.thumb img,img.full{width:100%;height:100%;object-fit:cover;display:block;grid-column:1/-1;grid-row:1/-1}
.info{padding:1rem 1.15rem 1.25rem}.info h3{font:700 1.2rem var(--display);margin:0 0 .15rem}.info p{margin:0;color:var(--muted);font-size:.97rem}
.tag{display:inline-block;font-size:.85rem;font-weight:600;background:var(--c3);color:#14173d;border-radius:.4rem;padding:.1rem .55rem;margin-bottom:.5rem}
.gal{grid-template-columns:repeat(auto-fill,minmax(min(100%,11rem),1fr));gap:.9rem}
.gal button{padding:0;border:2px solid var(--line);border-radius:.8rem;overflow:hidden;background:var(--card);cursor:pointer;color:inherit;font:inherit}
.gal button:hover{border-color:var(--ink)}.gal .thumb{aspect-ratio:1}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.7rem}
.chips li{display:flex;align-items:center;gap:.6rem;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.35rem 1rem .35rem .4rem;font-weight:600}
.chips li b{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;color:#14173d;font:800 .95rem var(--display)}
.chips li span{color:var(--muted);font-weight:400;font-size:.9rem}
.contact{background:var(--c1);color:#fff;border-radius:1.5rem;padding:3rem 2rem;margin-bottom:3rem}
.contact h2{margin-bottom:.75rem}.contact p{margin:0 0 1.5rem;max-width:30rem}
.contact .btn{background:var(--c3);border-color:var(--c3);color:#14173d}.contact .btn.alt{background:transparent;color:#fff;border-color:#fff}
.contact .btn:hover{background:#fff;border-color:#fff;color:#14173d}
footer{padding:0 0 2.5rem;color:var(--muted);font-size:.95rem}
dialog{border:0;border-radius:1rem;padding:0;max-width:min(90vw,40rem);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,40,.75)}dialog .thumb{aspect-ratio:1}dialog .row{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.1rem;font-weight:600}
dialog button{background:var(--ink);color:var(--bg);border:0;border-radius:.5rem;padding:.4rem .9rem;font:600 1rem var(--body);cursor:pointer}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#inicio"><b></b><span id="brand"></span></a>
    <nav aria-label="Principal"><a href="#proyectos">Proyectos</a><a href="#galeria">Galería</a><a href="#clientes">Clientes</a><a href="#contacto">Contacto</a></nav>
  </header>
  <main id="inicio">
    <div class="hero">
      <div>
        <small id="role"></small>
        <h1 id="headline"></h1>
        <p id="bio"></p>
        <div class="btns"><a class="btn" href="#proyectos">Ver proyectos</a><a class="btn alt" href="#contacto">Contacto</a></div>
      </div>
      <div id="mosaic" role="img" aria-label="Mosaico de cubos de colores"></div>
    </div>
    <section id="proyectos"><h2>Proyectos</h2><p class="sub" id="projSub"></p><div class="grid" id="projects"></div></section>
    <section id="galeria"><h2>Galería de modelos</h2><p class="sub" id="galSub"></p><div class="grid gal" id="gallery"></div></section>
    <section id="clientes"><h2>Clientes y colaboraciones</h2><p class="sub" id="cliSub"></p><ul class="chips" id="clients"></ul></section>
    <section id="contacto"><div class="contact"><h2>¿Hacemos algo juntos?</h2><p id="contactText"></p><div class="btns" id="links"></div></div></section>
  </main>
  <footer id="foot"></footer>
</div>
<dialog id="dlg"><div id="dlgArt"></div><div class="row"><span id="dlgTitle"></span><button id="dlgClose">Cerrar</button></div></dialog>

<script>
/* ============ EDITÁ ACÁ TU CONTENIDO ============
   - Para sumar una imagen real: poné  img:"data:image/png;base64,..."  (o pedile a Claude que la cargue).
   - Sin img, se muestra un bloque de colores de ejemplo.
   - Colores disponibles: "c1" azul, "c2" rosa, "c3" amarillo, "c4" menta, "c5" violeta.                    */
const SITE = {
  nombre: "Tazlify",
  rol: "Modelador 3D · Blockbench",
  titular: "Modelos 3D con muchos cubos y mucho color.",
  bio: "Creo modelos 3D para Minecraft: personajes, objetos y escenarios para eventos, servidores y proyectos de creadores de contenido.",
  contacto: "Contame tu idea y te paso una propuesta con tiempos y precio.",
  proyectos: [
    {titulo:"Proyecto de ejemplo 1", tipo:"Evento 2026", texto:"Entidades y objetos 3D personalizados.", colores:["c1","c2","c3"], link:""},
    {titulo:"Proyecto de ejemplo 2", tipo:"Servidor", texto:"Props y decoración temática.", colores:["c4","c5","c3"], link:""},
    {titulo:"Proyecto de ejemplo 3", tipo:"Serie", texto:"Modelos de personajes y criaturas.", colores:["c2","c5","c1"], link:""},
    {titulo:"Proyecto de ejemplo 4", tipo:"Texture pack", texto:"Modelos integrados en un pack para Java.", colores:["c3","c4","c2"], link:""}
  ],
  galeria: [
    {titulo:"Modelo 1", colores:["c1","c3"]},{titulo:"Modelo 2", colores:["c2","c5"]},{titulo:"Modelo 3", colores:["c4","c1"]},
    {titulo:"Modelo 4", colores:["c5","c3"]},{titulo:"Modelo 5", colores:["c3","c2"]},{titulo:"Modelo 6", colores:["c1","c4"]},
    {titulo:"Modelo 7", colores:["c2","c4"]},{titulo:"Modelo 8", colores:["c5","c1"]}
  ],
  clientes: [
    {nombre:"Cliente 1", detalle:"Youtuber", color:"c3"},{nombre:"Cliente 2", detalle:"Creador de eventos", color:"c2"},
    {nombre:"Cliente 3", detalle:"Estudio de juegos", color:"c4"},{nombre:"Cliente 4", detalle:"Streamer", color:"c5"}
  ],
  enlaces: [
    {texto:"X / Twitter", url:"https://x.com/tazlify"},
    {texto:"Escribime por mail", url:"mailto:hola@tunombre.com", principal:true}
  ]
};
/* ================================================ */
const $=id=>document.getElementById(id), V=c=>`var(--${c})`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function art(o,seed){
  if(o.img) return `<div class="thumb"><img src="${esc(o.img)}" alt="${esc(o.titulo)}"></div>`;
  const cs=o.colores&&o.colores.length?o.colores:["c1","c2"]; let h="",s=seed*7+3;
  for(let i=0;i<24;i++){s=(s*9301+49297)%233280;const r=s/233280;h+=`<i style="background:${r<.08?"transparent":V(cs[Math.floor(r*10)%cs.length])}"></i>`}
  return `<div class="thumb" role="img" aria-label="${esc(o.titulo)}">${h}</div>`;
}
document.title=SITE.nombre+" – "+SITE.rol;
$("brand").textContent=SITE.nombre;$("role").textContent=SITE.rol;$("headline").textContent=SITE.titular;
$("bio").textContent=SITE.bio;$("contactText").textContent=SITE.contacto;
$("projSub").textContent="Trabajos para eventos, servidores y creadores.";
$("galSub").textContent="Modelos personales. Tocá uno para verlo más grande.";
$("cliSub").textContent="Personas y proyectos con los que trabajé.";
$("foot").textContent="© 2026 "+SITE.nombre+".";
$("projects").innerHTML=SITE.proyectos.map((p,i)=>{
  const inner=`${art(p,i+1)}<div class="info"><span class="tag">${esc(p.tipo)}</span><h3>${esc(p.titulo)}</h3><p>${esc(p.texto)}</p></div>`;
  return p.link?`<a class="card" href="${esc(p.link)}">${inner}</a>`:`<div class="card">${inner}</div>`}).join("");
$("gallery").innerHTML=SITE.galeria.map((g,i)=>`<button type="button" data-i="${i}" aria-label="Ver ${esc(g.titulo)}">${art(g,i+20)}</button>`).join("");
$("clients").innerHTML=SITE.clientes.map(c=>`<li><b style="background:${V(c.color||"c3")}">${esc(c.nombre.charAt(0))}</b>${esc(c.nombre)} <span>${esc(c.detalle)}</span></li>`).join("");
$("links").innerHTML=SITE.enlaces.map(l=>`<a class="btn${l.principal?"":" alt"}" href="${esc(l.url)}">${esc(l.texto)}</a>`).join("");
/* mosaico del hero: tocá un cubo para cambiarle el color */
const pal=["c1","c2","c3","c4","c5"];let m="";
for(let i=0;i<64;i++){m+=`<i style="background:${V(pal[(i*7+Math.floor(i/8)*3)%5])}"></i>`}
$("mosaic").innerHTML=m;
$("mosaic").addEventListener("click",e=>{if(e.target.tagName==="I")e.target.style.background=V(pal[Math.floor(Math.random()*5)])});
$("mosaic").addEventListener("mouseover",e=>{if(e.target.tagName==="I")e.target.style.background=V(pal[Math.floor(Math.random()*5)])});
/* visor de galería */
const dlg=$("dlg");
$("gallery").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const g=SITE.galeria[+b.dataset.i];
  $("dlgArt").innerHTML=art(g,+b.dataset.i+20);$("dlgTitle").textContent=g.titulo;dlg.showModal()});
$("dlgClose").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
